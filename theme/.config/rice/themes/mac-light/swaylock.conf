# Mac Light — Apple system colors (light): pure white, crisp near-black text
# Whole config is theme-managed (swaylock has no include directive) — theme-set
# symlinks this file to ~/.config/swaylock/config. Background image is passed
# via --image at invocation time.

font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10
ignore-empty-password
show-failed-attempts

color=ffffff
scaling=fill

ring-color=007aff
ring-clear-color=1d1d1f
ring-ver-color=34c759
ring-wrong-color=ff3b30
inside-color=ffffff
inside-clear-color=ffffff
inside-ver-color=ffffff
inside-wrong-color=ffffff
line-uses-ring
text-color=1d1d1f
text-clear-color=1d1d1f
text-ver-color=1d1d1f
text-wrong-color=1d1d1f
separator-color=00000000
key-hl-color=007aff
bs-hl-color=ff3b30
