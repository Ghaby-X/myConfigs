# Catppuccin Latte — https://github.com/catppuccin/catppuccin

set $bg       #eff1f5
set $fg       #4c4f69
set $accent   #1e66f5
set $urgent   #d20f39
set $inactive #ccd0da

# Window border colors — teal, same pattern as the other two themes (kept
# separate from $accent).
set $border_focused   #179299aa
set $border_unfocused #9ca0b0aa

client.focused          $border_focused $bg $fg $border_focused $border_focused
client.focused_inactive $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.unfocused        $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.urgent           $urgent $bg $fg $urgent $urgent
