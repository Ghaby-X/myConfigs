# Catppuccin Latte — https://github.com/catppuccin/catppuccin
# Whole config is theme-managed (swaylock has no include directive, unlike
# the other apps) — theme-set symlinks this file wholesale to
# ~/.config/swaylock/config. Background image passed via --image at
# invocation time instead (shell-expands ~, unlike this ini-style config).

font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10
ignore-empty-password
show-failed-attempts

color=eff1f5
scaling=fill

ring-color=1e66f5
ring-clear-color=4c4f69
ring-ver-color=40a02b
ring-wrong-color=d20f39
inside-color=eff1f5
inside-clear-color=eff1f5
inside-ver-color=eff1f5
inside-wrong-color=eff1f5
line-uses-ring
text-color=4c4f69
text-clear-color=4c4f69
text-ver-color=4c4f69
text-wrong-color=4c4f69
separator-color=00000000
key-hl-color=1e66f5
bs-hl-color=d20f39
