# Mac Dark — Apple system colors (dark): true black shell, crisp white text
# Whole config is theme-managed (swaylock has no include directive) — theme-set
# symlinks this file to ~/.config/swaylock/config. Background image is passed
# via --image at invocation time.

font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10
ignore-empty-password
show-failed-attempts

color=1c1c1e
scaling=fill

ring-color=0a84ff
ring-clear-color=f5f5f7
ring-ver-color=32d74b
ring-wrong-color=ff453a
inside-color=1c1c1e
inside-clear-color=1c1c1e
inside-ver-color=1c1c1e
inside-wrong-color=1c1c1e
line-uses-ring
text-color=f5f5f7
text-clear-color=f5f5f7
text-ver-color=f5f5f7
text-wrong-color=f5f5f7
separator-color=00000000
key-hl-color=0a84ff
bs-hl-color=ff453a
