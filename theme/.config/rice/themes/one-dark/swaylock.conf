# One Dark by Giuseppe Cesarano, https://github.com/GiuseppeCesarano
# Whole config is theme-managed (swaylock has no include directive, unlike
# the other apps) — theme-set symlinks this file wholesale to
# ~/.config/swaylock/config. Background image passed via --image at
# invocation time instead (shell-expands ~, unlike this ini-style config).

font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10
ignore-empty-password
show-failed-attempts

color=282c34
scaling=fill

ring-color=61afef
ring-clear-color=979eab
ring-ver-color=98c379
ring-wrong-color=e06c75
inside-color=282c34
inside-clear-color=282c34
inside-ver-color=282c34
inside-wrong-color=282c34
line-uses-ring
text-color=979eab
text-clear-color=979eab
text-ver-color=979eab
text-wrong-color=979eab
separator-color=00000000
key-hl-color=61afef
bs-hl-color=e06c75
