# One Dark by Giuseppe Cesarano, https://github.com/GiuseppeCesarano

set $bg       #282c34
set $fg       #979eab
set $accent   #61afef
set $urgent   #e06c75
set $inactive #393e48

# Window border colors — ported directly from a previously-tuned hyprland
# config (rgba(56b6c2aa) / rgba(595959aa)), kept separate from $accent since
# that config styled window borders and the bar independently.
set $border_focused   #56b6c2aa
set $border_unfocused #595959aa

client.focused          $border_focused $bg $fg $border_focused $border_focused
client.focused_inactive $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.unfocused        $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.urgent           $urgent $bg $fg $urgent $urgent
