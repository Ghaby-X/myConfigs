# Catppuccin Mocha — https://github.com/catppuccin/catppuccin
set $bg       #1e1e2e
set $fg       #cdd6f4
set $accent   #89b4fa
set $urgent   #f38ba8
set $inactive #45475a

# Window border colors — muted teal (Catppuccin's own "Teal" swatch) with the
# same alpha as one-dark's, kept separate from $accent (bar vs. window borders
# were styled independently in the hyprland+waybar setup this replaces).
set $border_focused   #94e2d5aa
set $border_unfocused #45475aaa

client.focused          $border_focused $bg $fg $border_focused $border_focused
client.focused_inactive $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.unfocused        $border_unfocused $bg $fg $border_unfocused $border_unfocused
client.urgent           $urgent $bg $fg $urgent $urgent
