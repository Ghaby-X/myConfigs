# Catppuccin Mocha — https://github.com/catppuccin/catppuccin
# Whole config is theme-managed (swaylock has no include directive, unlike
# the other apps) — theme-set symlinks this file wholesale to
# ~/.config/swaylock/config. Background image passed via --image at
# invocation time instead (shell-expands ~, unlike this ini-style config).

font=JetBrainsMono Nerd Font
indicator-radius=100
indicator-thickness=10
ignore-empty-password
show-failed-attempts

color=1e1e2e
scaling=fill

ring-color=89b4fa
ring-clear-color=cdd6f4
ring-ver-color=a6e3a1
ring-wrong-color=f38ba8
inside-color=1e1e2e
inside-clear-color=1e1e2e
inside-ver-color=1e1e2e
inside-wrong-color=1e1e2e
line-uses-ring
text-color=cdd6f4
text-clear-color=cdd6f4
text-ver-color=cdd6f4
text-wrong-color=cdd6f4
separator-color=00000000
key-hl-color=89b4fa
bs-hl-color=f38ba8
