# ==============================================================================
#  tmux config  (colors come from the rice theme: ~/.config/tmux/current-theme.conf)
#
#  Lines starting with `#:` describe the binding below them for the $mod+/ cheat sheet.
# ==============================================================================

# ---------------------------------------------------------
# General & Terminal Settings
# ---------------------------------------------------------
# Set prefix to Ctrl+a (more ergonomic than Ctrl+b)
unbind C-b
#: tmux | Prefix key (press before any tmux key below)
set -g prefix C-a
bind C-a send-prefix

# True color & Kitty terminal support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Speed up responsiveness (critical for Neovim/Vim)
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# Enable mouse support (resizing, clicking, scrolling)
set -g mouse on

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------
# Keybindings
# ---------------------------------------------------------
# Easy config reload
#: tmux | Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓  tmux.conf reloaded!"

# Split panes in current working directory
#: tmux | Split pane side by side
bind | split-window -h -c "#{pane_current_path}"
#: tmux | Split pane side by side
bind \\ split-window -h -c "#{pane_current_path}"
#: tmux | Split pane top / bottom
bind - split-window -v -c "#{pane_current_path}"
#: tmux | Split pane top / bottom
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current working directory
#: tmux | New window
bind c new-window -c "#{pane_current_path}"

# Toggle status bar visibility
#: tmux | Show / hide the status bar
bind b set -g status

# Resize panes with Vim keys (repeatable with -r)
#: tmux | Resize pane (repeatable)
bind -r H resize-pane -L 5
#: tmux | Resize pane (repeatable)
bind -r J resize-pane -D 5
#: tmux | Resize pane (repeatable)
bind -r K resize-pane -U 5
#: tmux | Resize pane (repeatable)
bind -r L resize-pane -R 5

# ---------------------------------------------------------
# Vi Copy Mode & Wayland Clipboard
# ---------------------------------------------------------
setw -g mode-keys vi
#: tmux | Copy mode: start selection
bind -T copy-mode-vi v send -X begin-selection
#: tmux | Copy mode: rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
#: tmux | Copy mode: copy to system clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
#: tmux | Copy mode: copy to system clipboard
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
#: tmux | Paste tmux buffer
bind P paste-buffer

# ---------------------------------------------------------
# Status bar & pane colors: generated from the active rice theme
# ---------------------------------------------------------
set -g status-position top
set -g status-justify left
set -g status-interval 2
set -g status-left-length 40
set -g status-right-length 100
setw -g window-status-separator " "
source-file -q ~/.config/tmux/current-theme.conf

# ---------------------------------------------------------
# Vim-Tmux Navigator (pane switching with awareness of Vim splits)
# The bindings below are what the vim-tmux-navigator tmux plugin would add, so
# the plugin itself isn't loaded. (Install the matching plugin inside Neovim.)
# ---------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
#: tmux | Focus pane left (Ctrl, no prefix)
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
#: tmux | Focus pane below (Ctrl, no prefix)
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
#: tmux | Focus pane above (Ctrl, no prefix)
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
#: tmux | Focus pane right (Ctrl, no prefix)
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ---------------------------------------------------------
# Plugins (TPM) — installed by scripts/tmux-plugins.sh
# ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum & Resurrect settings
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Initialize TMUX plugin manager (keep this at the very bottom of tmux.conf)
if-shell "[ -f ~/.config/tmux/plugins/tpm/tpm ]" "run '~/.config/tmux/plugins/tpm/tpm'"
